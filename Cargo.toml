[package]
name = "gridx2"
version = "0.1.0"
edition = "2024"

[dependencies]
eyre = "0.6"
gtk4 = { version = "0.9", features = ["v4_10"] }
home = "0.5"
image = { version = "0.25", features = ["avif-native"] }
lru = "0.16"
rayon = "1.12"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
strum = { version = "0.27", features = ["derive"] }
strum_macros = "0.27"
toml = "0.8"
walkdir = "2.5"
